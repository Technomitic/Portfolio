<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#000428,#004e92);
    background-size:400% 400%;
    animation:bg 15s ease infinite;
    color:#fff;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
    width:90%;
    max-width:700px;
    padding:50px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    box-shadow:0 0 30px rgba(255,255,255,.15);
    animation:float 5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

.logo{
    font-size:60px;
    font-weight:bold;
    letter-spacing:4px;
    margin-bottom:25px;
    animation:glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px cyan;
    }
    to{
        text-shadow:0 0 25px cyan,0 0 50px cyan;
    }
}

.subtitle{
    font-size:22px;
    line-height:1.7;
    opacity:.9;
    margin-bottom:35px;
}

.progress{
    width:90%;
    height:12px;
    margin:auto;
    background:rgba(255,255,255,.15);
    border-radius:20px;
    overflow:hidden;
}

.progress div{
    width:70%;
    height:100%;
    background:linear-gradient(90deg,#00d2ff,#3a7bd5,#00d2ff);
    background-size:200%;
    animation:loading 2s linear infinite;
}

@keyframes loading{
    from{
        background-position:0%;
    }
    to{
        background-position:200%;
    }
}

.footer{
    margin-top:35px;
    font-size:14px;
    opacity:.75;
}

@media(max-width:600px){

.logo{
    font-size:42px;
}

.subtitle{
    font-size:18px;
}

.container{
    padding:35px 20px;
}

}
</style>

</head>
<body>

<canvas id="canvas"></canvas>

<div class="container">

    <div class="logo">COMING SOON</div>

    <div class="subtitle">
        🚀 Our website is currently under construction.<br><br>
        We're working hard to create something amazing.<br>
        Please check back soon!
    </div>

    <div class="progress">
        <div></div>
    </div>

    <div class="footer">
        © 2026 • Launching Soon
    </div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<120;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*3+1,
        dx:(Math.random()-0.5)*0.6,
        dy:(Math.random()-0.5)*0.6
    });
}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,0.8)";
        ctx.fill();

        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;

    });

    requestAnimationFrame(animate);

}

animate();

window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});

</script>

</body>
</html>
